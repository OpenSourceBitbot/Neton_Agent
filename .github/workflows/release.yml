name: NETON Release Build

# 手动触发（可指定已有 tag 补发资产）或推送 v* tag 自动触发
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并上传资产的 tag（如 v0.7.0）"
        required: true
        default: "v0.7.0"
      include_macos:
        description: "是否同时构建 macOS 包"
        type: boolean
        required: false
        default: true
      include_windows:
        description: "是否构建 Windows 包（未签名 exe 会被杀毒误报，可关闭）"
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  # 确保目标 tag 的 Release 已存在（gh release upload 不支持自动创建）
  ensure-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - run: gh api repos/$GITHUB_REPOSITORY/releases/tags/$TAG >/dev/null 2>&1 || gh release create "$TAG" --title "NETON $TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}

  linux:
    needs: ensure-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 手动补发时检出 main（包含最新兼容性修复），tag 推送时检出对应 tag
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: 构建
        run: |
          npm ci
          # 前端静态检查（no-undef 闸门：漏声明变量渲染期 ReferenceError → 黑屏，构建前拦截）
          npm run lint
          npx tauri build
      - name: 打包通用二进制 tar.gz（Gentoo/Void 等无 deb/rpm 系发行版）
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          tar -czf "NETON_${VERSION}_x86_64.tar.gz" -C src-tauri/target/release NETON
          # 运行时依赖（webkit2gtk-4.1 等）由发行版提供
      - name: 上传到 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          gh release upload "$TAG" \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            NETON_*_x86_64.tar.gz \
            --clobber --repo "$GITHUB_REPOSITORY"

  windows:
    # Windows x64：MSI + NSIS 双格式（WiX 对 x64 支持完善）
    needs: ensure-release
    if: github.event_name == 'push' || inputs.include_windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: 构建
        run: |
          npm ci
          npx tauri build
      - name: 打包便携版（免安装单文件 exe）
        shell: pwsh
        env:
          TAG: ${{ needs.ensure-release.outputs.tag }}
        run: |
          # Tauri v2 在 MSVC 目标下静态链接 WebView2LoaderStatic（见 webview2-com-sys/src/lib.rs），
          # NETON.exe 自包含，无需携带 WebView2Loader.dll；运行时仅依赖系统 WebView2 Runtime
          Test-Path src-tauri/target/release/NETON.exe
          Compress-Archive -Path src-tauri/target/release/NETON.exe -DestinationPath "NETON_$($env:TAG.TrimStart('v'))_x64-portable.zip" -Force
      - name: 上传到 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ needs.ensure-release.outputs.tag }}"
          gh release upload "$TAG" \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/release/bundle/nsis/*-setup.exe \
            NETON_*_x64-portable.zip \
            --clobber --repo "$GITHUB_REPOSITORY"

  macos:
    needs: ensure-release
    if: github.event_name == 'push' || inputs.include_macos
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: 构建 arm64 + x86_64
        run: |
          npm ci
          # 前端静态检查（no-undef 闸门）
          npm run lint
          # --bundles app：只打 .app，跳过 tauri 自带的 bundle_dmg（hdiutil 偶发
          # 挂死导致整个 job 失败）；dmg 在下方"重打 dmg"步骤用 hdiutil 手工生成
          npx tauri build --target aarch64-apple-darwin --bundles app
          npx tauri build --target x86_64-apple-darwin --bundles app
      - name: 补全 ad-hoc bundle 签名（避免 Gatekeeper 报"已损坏"）
        run: |
          # tauri bundler 只对二进制做 linker 签名，bundle 缺 CodeResources/PkgInfo，
          # 下载后带 quarantine 属性时 macOS 会判定签名不自洽 → "已损坏，无法打开"。
          # 此处补 PkgInfo 并对整个 .app 做 ad-hoc 深签名，使 bundle 签名自洽。
          for T in aarch64-apple-darwin x86_64-apple-darwin; do
            APP="src-tauri/target/$T/release/bundle/macos/NETON.app"
            printf 'APPL????' > "$APP/Contents/PkgInfo"
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep --strict "$APP"
          done
      - name: 重打 dmg + 打包便携版 .app zip（包含签名修复后的 .app）
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          for T in aarch64-apple-darwin x86_64-apple-darwin; do
            case $T in aarch64*) DMGARCH=aarch64;; *) DMGARCH=x64;; esac
            APP="src-tauri/target/$T/release/bundle/macos/NETON.app"
            DMGDIR="src-tauri/target/$T/release/bundle/dmg"
            # --bundles app 模式下 bundler 不创建 dmg 目录，hdiutil 输出路径父目录缺失会直接报
            # "No such file or directory"（v0.6.15 实锤），先补目录
            mkdir -p "$DMGDIR"
            STAGE=$(mktemp -d)
            cp -R "$APP" "$STAGE/NETON.app"
            ln -s /Applications "$STAGE/Applications"
            rm -f "$DMGDIR"/NETON_*.dmg
            hdiutil create -volname "NETON" -srcfolder "$STAGE" -ov -format UDZO -fs HFS+ "$DMGDIR/NETON_${VERSION}_${DMGARCH}.dmg"
            rm -rf "$STAGE"
            # 便携版：免安装 .app zip（对齐 Windows portable 产物）
            # 必须用 ditto 保留代码签名与扩展属性，普通 zip 会破坏签名导致"已损坏"
            ditto -c -k --keepParent --sequesterRsrc "$APP" "$DMGDIR/NETON_${VERSION}_${DMGARCH}-app.zip"
          done
      - name: 上传到 Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          gh release upload "$TAG" \
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg \
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg \
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*-app.zip \
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*-app.zip \
            --clobber --repo "$GITHUB_REPOSITORY"

  # 收尾：核心平台构建完成后，自动生成 latest.json 上传到 Release
  finalize:
    needs: [ensure-release, linux, windows, macos]
    if: >-
      always() && !cancelled() &&
      needs.ensure-release.result == 'success' &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: 生成 latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.ensure-release.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          # notes 取 Release 说明前 300 字符，与客户端 GitHub API 回退路径的截断一致
          NOTES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body | head -c 300)
          # assets 映射：客户端自动更新按平台取直链（NETON 客户端 pick_asset 消费）
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          # 从 GITHUB_REPOSITORY 动态推导 GitHub Pages URL：owner.github.io/repo
          REPO_OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          PAGES_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/${VERSION}/"
          jq -n --arg v "$VERSION" --arg n "$NOTES" --arg u "$PAGES_URL" \
            --arg w64 "$BASE/NETON_${VERSION}_x64-setup.exe" \
            --arg maa "$BASE/NETON_${VERSION}_aarch64-app.zip" \
            --arg max "$BASE/NETON_${VERSION}_x64-app.zip" \
            --arg lx64 "$BASE/NETON_${VERSION}_amd64.AppImage" \
            '{version: $v, notes: $n, url: $u, assets: {
              "windows-x64": $w64,
              "macos-arm64": $maa, "macos-x64": $max,
              "linux-x64": $lx64
            }}' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
          echo "latest.json 已上传（tag=$TAG）"
